<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Enabled Budget Making System (AI-BMS){% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
    <div class="login-card">
        <img src="/static/gom_logo.png" alt="Maharashtra शासन Logo" class="login-logo">

        {% block header %}
        <div class="login-header-text">महाराष्ट्र शासन</div>
        <div class="login-title">AI Enabled Budget Making System</div>
        <div class="login-acronym">(AI-BMS)</div>
        <div class="login-gov-text-close">Divisional Commissioners Office</div>
        <div class="login-gov-text-close">Konkan Division</div>
        <div class="login-gov-text">Government Of Maharashtra</div>
        {% endblock %}

        {% block form %}
        <div class="login-form">
            <input type="text" id="username" class="login-input" placeholder="Username" required>
            <div class="password-container">
                <input type="password" id="password" class="login-input" placeholder="Password" required>
                <button type="button" class="password-toggle" id="password-toggle" aria-label="Toggle password visibility">
                    Show
                </button>
            </div>
            <button class="login-button" onclick="login()">Login</button>
            <div id="error-message" class="error-message">Invalid username or password.</div>
        </div>
        {% endblock %}

        {% block footer %}{% endblock %}
    </div>

    {% block scripts %}
    <script>
        (function() {
            let usernameInput, passwordInput, passwordToggle, errorMessage;

            const cacheElements = () => {
                usernameInput = document.getElementById('username');
                passwordInput = document.getElementById('password');
                passwordToggle = document.getElementById('password-toggle');
                errorMessage = document.getElementById('error-message');
            };

            const login = async () => {
                const username = usernameInput?.value?.trim();
                const password = passwordInput?.value;

                if (!username || !password) {
                    if (errorMessage) {
                        errorMessage.textContent = 'Please enter both username and password.';
                        errorMessage.style.display = 'block';
                    }
                    return;
                }

                if (errorMessage) errorMessage.style.display = 'none';

                try {
                    const response = await fetch('/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    if (!response.ok) throw new Error('Authentication failed');

                    const data = await response.json();
                    const userRole = data?.user?.role || '';

                    window.location.href = userRole === 'admin'
                        ? '/admin/users'
                        : '/ui/budget-post-details?view=edit';

                } catch (error) {
                    console.warn('Login failed:', error);
                    if (errorMessage) {
                        errorMessage.textContent = 'Invalid username or password.';
                        errorMessage.style.display = 'block';
                    }
                }
            };

            const handlePasswordToggle = () => {
                if (!passwordInput || !passwordToggle) return;
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                passwordToggle.textContent = isPassword ? 'Hide' : 'Show';
                passwordToggle.setAttribute('aria-label',
                    isPassword ? 'Hide password' : 'Show password');
            };

            const initFeatures = () => {
                if (passwordToggle && passwordInput) {
                    passwordToggle.addEventListener('click', handlePasswordToggle, { passive: true });
                }

                if (usernameInput) {
                    setTimeout(() => usernameInput.focus(), 100);
                }
            };

            const initialize = () => {
                cacheElements();
                initFeatures();
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initialize, { once: true });
            } else {
                initialize();
            }

            window.login = login;
        })();
    </script>
    {% endblock %}
</body>
</html>
