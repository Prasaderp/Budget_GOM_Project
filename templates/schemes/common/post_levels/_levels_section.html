{# Post Levels Management Section #}

<div id="postLevelsSection" style="margin-top:32px;padding:24px;background:var(--panel-elevated);border-radius:var(--radius-xl);border:1px solid var(--border);box-shadow:var(--shadow-sm);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
        <h3 style="margin:0;font-size:18px;font-weight:700;color:var(--primary);">स्तर व्यवस्थापन</h3>
        <div style="display:flex;gap:12px;align-items:center;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 16px;background:var(--panel);border-radius:var(--radius-lg);border:1px solid var(--border);">
                <input type="checkbox" id="annualModeToggle" checked style="width:18px;height:18px;cursor:pointer;">
                <span style="font-size:14px;font-weight:600;color:var(--text);">वार्षिक मोड (×12)</span>
            </label>
            <button type="button" id="addLevelBtn" style="padding:10px 20px;background:var(--primary);color:white;border:none;border-radius:var(--radius-lg);font-weight:600;cursor:pointer;">+ स्तर जोडा</button>
        </div>
    </div>
    
    <div id="aggregatePreview" style="padding:12px;background:var(--muted);border-radius:var(--radius-md);margin-bottom:20px;font-size:14px;color:var(--text);">
        एकूण स्तर: 0 | मुळ वेतन: 0 | एकूण: 0
    </div>
    
    <div style="overflow-x:auto;margin-bottom:20px;">
        <table style="width:100%;border-collapse:collapse;">
            <thead>
                <tr style="background:var(--muted);">
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">क्रम</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">स्तराचे नाव</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">वेतन श्रेणी / स्तर</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">मुळ वेतन</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">ग्रेड वेतन</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">महागाई भत्ता 64%</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">घर भाडे भत्ता</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">वाहन भत्ता</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">एकूण</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border);">कृती</th>
                </tr>
            </thead>
            <tbody id="levelsTableBody">
                <tr><td colspan="10" style="text-align:center;padding:20px;">स्तर नाहीत</td></tr>
            </tbody>
        </table>
    </div>
    
    <div id="levelFormSection" style="display:none;padding:20px;background:var(--panel);border:2px solid var(--primary);border-radius:var(--radius-lg);margin-top:20px;">
        <h4 style="margin:0 0 16px 0;font-size:16px;font-weight:700;color:var(--text);">स्तर तपशील</h4>
        
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;">
            <div class="form-group">
                <label for="levelName">स्तराचे नाव *</label>
                <input type="text" id="levelName" placeholder="उदा. स्तर १" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
            <div class="form-group">
                <label for="levelOrder">क्रमांक</label>
                <input type="number" id="levelOrder" min="1" value="1" readonly style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--muted);">
            </div>
            <div class="form-group">
                <label for="levelPayStage">वेतन श्रेणी (Pay Matrix)</label>
                <select id="levelPayStage" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
                    <option value="">-- श्रेणी निवडा --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="levelPayLevel">स्तर (Level)</label>
                <select id="levelPayLevel" disabled style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
                    <option value="">-- स्तर निवडा --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="levelSpecialPay">विशेष वेतन</label>
                <input type="number" id="levelSpecialPay" min="0" value="0" class="salary-field" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
            <div class="form-group">
                <label for="levelBasicPay">मुळ वेतन</label>
                <input type="number" id="levelBasicPay" min="0" value="0" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);" readonly>
            </div>
            <div class="form-group">
                <label for="levelGradePay">ग्रेड वेतन</label>
                <input type="number" id="levelGradePay" min="0" value="0" class="salary-field" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
            <div class="form-group">
                <label>महागाई भत्ता 64%</label>
                <input type="number" id="levelDaDisplay" readonly style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--muted);">
            </div>
            <div class="form-group">
                <label for="levelLocalAllowance">स्थानिक पुरक भत्ता</label>
                <input type="number" id="levelLocalAllowance" min="0" value="0" class="salary-field" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
            <div class="form-group">
                <label>घर भाडे भत्ता (HRA)</label>
                <div style="display:flex;gap:8px;">
                    <input type="number" id="levelHraDisplay" readonly style="flex:1;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--muted);">
                    <select id="levelHraRate" style="flex:0 0 80px;height:40px;padding:0 8px;border:1px solid var(--border);border-radius:var(--radius-md);">
                        <option value="X">X (30%)</option>
                        <option value="Y">Y (20%)</option>
                        <option value="Z">Z (10%)</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="levelVehicleAllowance">वाहन भत्ता</label>
                <input type="number" id="levelVehicleAllowance" min="0" value="0" class="salary-field" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
            <div class="form-group">
                <label for="levelWashingAllowance">धूलाई भत्ता</label>
                <input type="number" id="levelWashingAllowance" min="0" value="0" class="salary-field" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
            <div class="form-group">
                <label for="levelCashAllowance">रोख भत्ता</label>
                <input type="number" id="levelCashAllowance" min="0" value="0" class="salary-field" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
            <div class="form-group">
                <label for="levelFootwearAllowance">चप्पल भत्ता / इतर</label>
                <input type="number" id="levelFootwearAllowance" min="0" value="0" class="salary-field" style="width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-md);">
            </div>
        </div>
        
        <div style="display:flex;gap:12px;margin-top:20px;">
            <button type="button" id="saveLevelBtn" style="padding:12px 24px;background:var(--primary);color:white;border:none;border-radius:var(--radius-lg);font-weight:600;cursor:pointer;">जतन करा</button>
            <button type="button" id="cancelLevelBtn" style="padding:12px 24px;background:var(--muted);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-lg);font-weight:600;cursor:pointer;">रद्द करा</button>
        </div>
    </div>
</div>

<style>
#postLevelsSection table { font-size: 14px; }
#postLevelsSection th { font-weight: 600; white-space: nowrap; }
#postLevelsSection td { padding: 10px 12px; border: 1px solid var(--border); }
.btn-edit, .btn-delete { padding: 6px 12px; font-size: 13px; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; margin-right: 4px; }
.btn-edit { background: var(--primary); color: white; }
.btn-delete { background: var(--danger, #dc2626); color: white; }
</style>

<script src="/static/js/post_levels.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    {% if detail and detail.id %}
    postLevelsManager = new PostLevelsManager({
        budgetPostId: {{ detail.id }},
        apiBasePath: '{{ api_base_path|default("/ui/s20530028/budget-post-details/api/post-levels") }}',
        payMatrixApiPath: '{{ pay_matrix_api_path|default("/ui/s20530028/budget-post-details/api/pay-matrix") }}',
        subSchemeCode: '{{ sub_scheme_code|default("20530028") }}',
        tableName: '{{ table_name|default("budget_post_details_20530028") }}',
        fiscalYear: '{{ request.cookies.get("fiscal_year", "2025-26") }}'
    });
    {% endif %}
});
</script>
