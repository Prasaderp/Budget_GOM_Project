{% if can_edit %}
<div class="form-container" style="margin-bottom:32px; background:var(--panel-elevated); padding:28px; border-radius:var(--radius-xl); border:2px solid var(--primary); box-shadow:var(--shadow-lg);">
    <h3 style="margin:0 0 24px 0; font-size:18px; font-weight:700; color:var(--primary);">द्रुत संपादन</h3>
    <form id="inlineEditFormSection5" style="display:grid; gap:24px;">
        <input type="hidden" id="inline_record_id_s5" name="id">
        <div style="display:grid; grid-template-columns:repeat(1, 1fr); gap:20px;">
            <div class="form-group">
                <label for="inline_table_section_s5">लोगशिर्ष *</label>
                <select id="inline_table_section_s5" required style="height:48px;">
                    <option value="">-- लोगशिर्ष निवडा --</option>
                    {% for section in summary_rows %}
                    <option value="{{ section.section.code }}">{{ section.section.code }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div id="inline_edit_fields_s5" style="display:none;">
            {% if is_dco_assistant %}
            {% for district in all_districts %}
            <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; padding:24px; background:var(--panel); border-radius:var(--radius-lg); border:1px solid var(--border);">
                <h3 style="grid-column:1/-1; margin:0 0 12px 0; font-size:16px; font-weight:700; color:var(--text);">{{ districts_mr[district] }}</h3>
                <div class="form-group">
                    <label for="inline_{{ district.lower().replace(' ', '_') }}_deposit">जमा रकम</label>
                    <input type="number" id="inline_{{ district.lower().replace(' ', '_') }}_deposit" name="{{ district.replace(' ', '_') }}_deposit" min="0" step="1" value="0" style="height:48px;">
                </div>
                <div class="form-group">
                    <label for="inline_{{ district.lower().replace(' ', '_') }}_reconciliation">ताळमेळ रकम</label>
                    <input type="number" id="inline_{{ district.lower().replace(' ', '_') }}_reconciliation" name="{{ district.replace(' ', '_') }}_reconciliation" min="0" step="1" value="0" style="height:48px;">
                </div>
            </div>
            {% endfor %}
            {% elif user_district %}
            <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; padding:24px; background:var(--panel); border-radius:var(--radius-lg); border:1px solid var(--border);">
                <h3 style="grid-column:1/-1; margin:0 0 12px 0; font-size:16px; font-weight:700; color:var(--text);">{{ districts_mr[user_district] }}</h3>
                <div class="form-group">
                    <label for="inline_{{ user_district.lower().replace(' ', '_') }}_deposit">जमा रकम</label>
                    <input type="number" id="inline_{{ user_district.lower().replace(' ', '_') }}_deposit" name="{{ user_district.replace(' ', '_') }}_deposit" min="0" step="1" value="0" style="height:48px;">
                </div>
                <div class="form-group">
                    <label for="inline_{{ user_district.lower().replace(' ', '_') }}_reconciliation">ताळमेळ रकम</label>
                    <input type="number" id="inline_{{ user_district.lower().replace(' ', '_') }}_reconciliation" name="{{ user_district.replace(' ', '_') }}_reconciliation" min="0" step="1" value="0" style="height:48px;">
                </div>
            </div>
            {% endif %}
            <div style="display:flex; gap:16px; justify-content:flex-start;">
                <button type="submit" style="padding:14px 32px; font-size:15px; font-weight:700; background:var(--primary); color:white;">अपडेट रेकॉर्ड</button>
                <button type="button" onclick="resetInlineFormS5()" style="padding:14px 32px; font-size:15px; font-weight:700; background:var(--muted); color:var(--text); border:1px solid var(--border);">रीसेट</button>
            </div>
        </div>
    </form>
</div>
<div id="section5_config" data-is-dco-assistant="{% if is_dco_assistant %}true{% else %}false{% endif %}" data-user-district="{% if user_district %}{{ user_district.lower().replace(' ', '_') }}{% endif %}" style="display:none;"></div>
<script>
(function(){
    var tableSectionSel = document.getElementById('inline_table_section_s5');
    var editFields = document.getElementById('inline_edit_fields_s5');
    var form = document.getElementById('inlineEditFormSection5');
    var configEl = document.getElementById('section5_config');
    var isDcoAssistant = configEl.getAttribute('data-is-dco-assistant') === 'true';
    var userDistrict = configEl.getAttribute('data-user-district') || null;
    
    function loadRecordData() {
        var tableSection = tableSectionSel.value;
        if (!tableSection) {
            editFields.style.display = 'none';
            return;
        }
        var url = '/ui/s0029/section1/section5/api/get-record-by-section?table_section=' + encodeURIComponent(tableSection);
        fetch(url).then(function(r){ return r.json(); }).then(function(data){
            if (data.found) {
                document.getElementById('inline_record_id_s5').value = data.id;
                if (isDcoAssistant) {
                    document.getElementById('inline_mumbai_city_deposit').value = data.mumbai_city_deposit || 0;
                    document.getElementById('inline_mumbai_city_reconciliation').value = data.mumbai_city_reconciliation || 0;
                    document.getElementById('inline_mumbai_suburban_deposit').value = data.mumbai_suburban_deposit || 0;
                    document.getElementById('inline_mumbai_suburban_reconciliation').value = data.mumbai_suburban_reconciliation || 0;
                    document.getElementById('inline_thane_deposit').value = data.thane_deposit || 0;
                    document.getElementById('inline_thane_reconciliation').value = data.thane_reconciliation || 0;
                    document.getElementById('inline_raigad_deposit').value = data.raigad_deposit || 0;
                    document.getElementById('inline_raigad_reconciliation').value = data.raigad_reconciliation || 0;
                    document.getElementById('inline_ratnagiri_deposit').value = data.ratnagiri_deposit || 0;
                    document.getElementById('inline_ratnagiri_reconciliation').value = data.ratnagiri_reconciliation || 0;
                    document.getElementById('inline_sindhudurg_deposit').value = data.sindhudurg_deposit || 0;
                    document.getElementById('inline_sindhudurg_reconciliation').value = data.sindhudurg_reconciliation || 0;
                } else if (userDistrict) {
                    var districtKey = userDistrict;
                    var depositField = document.getElementById('inline_' + districtKey + '_deposit');
                    var reconField = document.getElementById('inline_' + districtKey + '_reconciliation');
                    var depositFieldName = districtKey + '_deposit';
                    var reconFieldName = districtKey + '_reconciliation';
                    if (depositField && data[depositFieldName] !== undefined) depositField.value = data[depositFieldName] || 0;
                    if (reconField && data[reconFieldName] !== undefined) reconField.value = data[reconFieldName] || 0;
                }
                editFields.style.display = 'grid';
            } else {
                editFields.style.display = 'none';
                if (typeof showNotification === 'function') {
                    showNotification('निवडलेल्या मापदंडांसाठी रेकॉर्ड सापडला नाही', 'warning');
                }
            }
        }).catch(function(err){
            editFields.style.display = 'none';
            console.error('Error loading record:', err);
        });
    }
    
    tableSectionSel.addEventListener('change', function(){ loadRecordData(); });
    
    form.addEventListener('submit', function(e){
        e.preventDefault();
        var formData = new FormData(form);
        fetch('/ui/s0029/section1/section5/api/update-inline', {
            method: 'POST',
            body: formData
        }).then(function(r){ return r.json(); }).then(function(data){
            if (data.success) {
                if (typeof showNotification === 'function') {
                    showNotification(data.message || 'अपडेट यशस्वी', 'success');
                }
                setTimeout(function(){ window.location.reload(); }, 1000);
            } else {
                if (typeof showNotification === 'function') {
                    showNotification(data.message || 'अपडेट अयशस्वी', 'error');
                }
            }
        }).catch(function(err){
            console.error('Update error:', err);
            if (typeof showNotification === 'function') {
                showNotification('अपडेट करताना त्रुटी', 'error');
            }
        });
    });
    
    window.resetInlineFormS5 = function() {
        form.reset();
        editFields.style.display = 'none';
        tableSectionSel.value = '';
    };
})();
</script>
{% endif %}
