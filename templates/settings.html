{% extends base_template|default("base.html") %}

{% block content %}
<div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <div style="background: var(--panel-elevated); border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-lg); border: 1px solid var(--border);">
        <div id="message-container" style="display: none; margin-bottom: 20px; padding: 12px 16px; border-radius: var(--radius); font-size: 14px;"></div>
        
        <form id="settings-form" novalidate>
            <div style="margin-bottom: 30px;">
                <label for="email" style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text);">
                    ईमेल पत्ता / Email Address
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="example@email.com"
                    style="width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--panel); color: var(--text);"
                >
                <small style="display: block; margin-top: 4px; color: var(--text-muted); font-size: 12px;">
                    डेटा भरण कालावधी, तालुका सक्रियता आणि आर्थिक वर्ष बदलांसाठी सूचना प्राप्त करा
                </small>
            </div>
            
            <div style="margin-bottom: 30px;">
                <label for="phone_number" style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text);">
                    फोन नंबर / Phone Number
                </label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-secondary); color: var(--text); font-size: 14px; font-weight: 500; white-space: nowrap;">
                        +91
                    </span>
                    <input 
                        type="tel" 
                        id="phone_number" 
                        name="phone_number" 
                        placeholder="98765 43210"
                        inputmode="numeric"
                        style="flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--panel); color: var(--text);"
                    >
                </div>
                <small style="display: block; margin-top: 4px; color: var(--text-muted); font-size: 12px;">
                    (10 अंक, भारतीय फोन नंबर) SMS सूचना लवकरच उपलब्ध होतील
                </small>
            </div>
            
            <div style="margin-bottom: 30px;">
                <label style="display: block; margin-bottom: 12px; font-weight: 500; color: var(--text);">
                    सूचना प्राधान्ये / Notification Preferences
                </label>
                
                <div style="background: var(--bg-secondary); padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border-light);">
                    <label style="display: flex; align-items: center; margin-bottom: 16px; cursor: pointer;">
                        <input 
                            type="checkbox" 
                            id="pref_data_filling_period" 
                            name="data_filling_period"
                            style="margin-right: 12px; width: 18px; height: 18px; cursor: pointer;"
                        >
                        <div>
                            <div style="font-weight: 500; color: var(--text); margin-bottom: 2px;">
                                डेटा भरण कालावधी / Data Filling Period
                            </div>
                            <div style="font-size: 12px; color: var(--text-muted);">
                                DCO Assistant द्वारे सेट केलेल्या डेटा भरण कालावधीबद्दल सूचना
                            </div>
                        </div>
                    </label>
                    
                    <label style="display: flex; align-items: center; margin-bottom: 16px; cursor: pointer;">
                        <input 
                            type="checkbox" 
                            id="pref_taluka_activation" 
                            name="taluka_activation"
                            style="margin-right: 12px; width: 18px; height: 18px; cursor: pointer;"
                        >
                        <div>
                            <div style="font-weight: 500; color: var(--text); margin-bottom: 2px;">
                                तालुका सक्रियता / Taluka Activation
                            </div>
                            <div style="font-size: 12px; color: var(--text-muted);">
                                तालुका सक्रिय/निष्क्रिय होण्याबद्दल सूचना
                            </div>
                        </div>
                    </label>
                    
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input 
                            type="checkbox" 
                            id="pref_fiscal_year_changes" 
                            name="fiscal_year_changes"
                            style="margin-right: 12px; width: 18px; height: 18px; cursor: pointer;"
                        >
                        <div>
                            <div style="font-weight: 500; color: var(--text); margin-bottom: 2px;">
                                आर्थिक वर्ष बदल / Fiscal Year Changes
                            </div>
                            <div style="font-size: 12px; color: var(--text-muted);">
                                नवीन आर्थिक वर्ष जोडल्याबद्दल किंवा हटवल्याबद्दल सूचना
                            </div>
                        </div>
                    </label>
                </div>
            </div>
            
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button 
                    type="button" 
                    id="cancel-btn"
                    style="padding: 12px 24px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--panel); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition);"
                    onmouseover="this.style.background='var(--bg-secondary)'"
                    onmouseout="this.style.background='var(--panel)'"
                >
                    रद्द करा / Cancel
                </button>
                <button 
                    type="submit" 
                    id="save-btn"
                    style="padding: 12px 24px; border: none; border-radius: var(--radius-lg); background: var(--primary); color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-sm);"
                    onmouseover="this.style.background='var(--primary-hover)'"
                    onmouseout="this.style.background='var(--primary)'"
                >
                    सेव्ह करा / Save
                </button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/settings.js"></script>
{% endblock %}
